name: Hourly Water Data Trigger

on:
  schedule:
    - cron: '0 * * * *' # รันทุกๆ ต้นชั่วโมง (นาทีที่ 0)
  workflow_dispatch: # อนุญาตให้กดปุ่มสั่งรันด้วยมือใน GitHub ได้

jobs:
  trigger-job:
    runs-on: ubuntu-latest
    steps:
      - name: Call Cron API Endpoint
        run: |
          curl -X GET "${{ secrets.NETLIFY_SITE_URL }}/api/cron" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"